[package]
name    = "tuzi"
version = "0.3.0"
edition = "2024"

[dependencies]
base64 = "0.22.1"
crossterm = { version = "=0.29.0", features = ["event-stream"] }
devicons = "0.6.13"
edtui = { version = "0.11.7", default-features = false }
futures-util = { version = "0.3.31", default-features = false, features = ["async-await"] }
infer = "0.22.0"
mime_guess = "2.0.5"
notify = "8.2.0"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
syntect-no-panic = "6.0.0"
tokio = { version = "1.53.1", features = ["io-util", "net", "rt-multi-thread", "macros", "process", "sync", "time"] }
toml = "1.1.4"
trash = "5.2.9"
