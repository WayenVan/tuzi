# Tuzi's complete built-in keymap. User bindings can replace, prepend to, or
# append to this list without recompiling the application.

[mgr]
keymap = [
	{ on = "q",       run = "quit",                        desc = "Quit" },
	{ on = "<Esc>",   run = "escape",                      desc = "Cancel" },
	{ on = "j",       run = "cursor 1",                    desc = "Move down" },
	{ on = "<Down>",  run = "cursor 1",                    desc = "Move down" },
	{ on = "k",       run = "cursor -1",                   desc = "Move up" },
	{ on = "K",       run = "entry-details",               desc = "Show entry details" },
	{ on = "I",       run = "filename-peek toggle",        desc = "Toggle filename peek" },
	{ on = "<Up>",    run = "cursor -1",                   desc = "Move up" },
	{ on = "<C-u>",   run = "page -50",                    desc = "Move up half page" },
	{ on = "<C-d>",   run = "page 50",                     desc = "Move down half page" },
	{ on = "<C-b>",   run = "page -100",                   desc = "Move up one page" },
	{ on = "<C-f>",   run = "page 100",                    desc = "Move down one page" },
	{ on = "<C-o>",   run = "history back",                desc = "Back to previous directory" },
	{ on = "<C-i>",   run = "history forward",             desc = "Forward to next directory" },
	{ on = "<Tab>",   run = "history forward",             desc = "Forward to next directory" },
	{ on = ["g", "g"], run = "cursor top",                desc = "Move to top" },
	{ on = ["g", "l"], run = "cd @selected",              desc = "Enter selected directory" },
	{ on = ["g", "t"], run = "cd @trash",                 desc = "Go to the trash" },
	{ on = ["g", "h"], run = "cd @home",                  desc = "Go to session home directory" },
	{ on = ["g", "~"], run = "cd ~",                      desc = "Go to home directory" },
	{ on = ["g", "c"], run = "cd @config",                desc = "Go to config directory" },
	{ on = ["g", "d"], run = "cd ~/Downloads",            desc = "Go to Downloads" },
	{ on = ["g", "D"], run = "cd ~/Desktop",              desc = "Go to Desktop" },
	{ on = "G",       run = "cursor bottom",               desc = "Move to bottom" },
	{ on = "l",       run = "expand",                      desc = "Expand" },
	{ on = "<Right>", run = "expand",                      desc = "Expand" },
	{ on = "<Enter>", run = "expand toggle",               desc = "Toggle directory" },
	{ on = "h",       run = "collapse",                    desc = "Collapse" },
	{ on = "<Left>",  run = "collapse",                    desc = "Collapse" },
	{ on = ["z", "c"], run = "collapse subtree",          desc = "Collapse current subtree" },
	{ on = ["z", "m"], run = "collapse siblings",         desc = "Collapse sibling subtrees" },
	{ on = ["z", "M"], run = "collapse all",              desc = "Collapse all subtrees" },
	{ on = ["z", "z"], run = "center",                    desc = "Center current row" },
	{ on = ";",       run = "select toggle",               desc = "Toggle selection" },
	{ on = "v",       run = "visual",                      desc = "Visual select" },
	{ on = "V",       run = "visual --unset",              desc = "Visual unset" },
	{ on = "d",       run = "remove",                      desc = "Move to Trash" },
	{ on = "D",       run = "remove --permanently",        desc = "Delete permanently" },
	{ on = "y",       run = "yank",                        desc = "Yank selected files (copy)" },
	{ on = "x",       run = "yank --cut",                  desc = "Yank selected files (cut)" },
	{ on = "p",       run = "paste",                       desc = "Paste" },
	{ on = [" ", "-"], run = "link --relative",          desc = "Paste as a relative symlink" },
	{ on = [" ", "_"], run = "link --absolute",          desc = "Paste as an absolute symlink" },
	{ on = [" ", " "], run = "fzf",                      desc = "Jump with fzf" },
	{ on = ["c", "c"], run = "copy path",                 desc = "Copy file path" },
	{ on = ["c", "C"], run = "copy url",                  desc = "Copy file URL" },
	{ on = ["c", "d"], run = "copy dirpath",              desc = "Copy directory path" },
	{ on = ["c", "D"], run = "copy dirurl",               desc = "Copy directory URL" },
	{ on = ["c", "f"], run = "copy filename",             desc = "Copy filename" },
	{ on = ["c", "n"], run = "copy stem",                 desc = "Copy filename without extension" },
	{ on = "r",       run = "rename",                      desc = "Rename" },
	{ on = "a",       run = "create",                      desc = "Create a file (end with / for directories)" },
	{ on = "/",       run = "find",                        desc = "Find next file" },
	{ on = "?",       run = "find --previous",             desc = "Find previous file" },
	{ on = "n",       run = "find repeat",                 desc = "Repeat find" },
	{ on = "N",       run = "find repeat --opposite",      desc = "Repeat find in reverse" },
	{ on = "f",       run = "filter",                      desc = "Filter files" },
	{ on = ":",       run = "command",                     desc = "Run command" },
	{ on = ".",       run = "hidden toggle",               desc = "Toggle hidden files" },
	{ on = "Z",       run = "zoxide",                      desc = "Jump with zoxide" },
	{ on = "o",       run = "open",                        desc = "Open selected files" },
	{ on = "O",       run = "open --interactive",          desc = "Open selected files interactively" },
	{ on = "w",       run = "tasks toggle",                desc = "Show task manager" },
	{ on = "<C-c>",   run = "tab close",                   desc = "Close tab" },
	{ on = "]",       run = "tab switch 1",                desc = "Next tab" },
	{ on = "[",       run = "tab switch -1",               desc = "Previous tab" },
	{ on = ["t", "t"], run = "tab create",                desc = "Create tab" },
	{ on = ["g", " "], run = "cd",                        desc = "Go to directory" },
	{ on = ["m", "n"], run = "column none",               desc = "Hide column" },
	{ on = ["m", "s"], run = "column size",               desc = "Show size column" },
	{ on = ["m", "p"], run = "column permissions",        desc = "Show permissions column" },
	{ on = ["m", "m"], run = "column modified",           desc = "Show modified column" },
	{ on = [",", "a"], run = "sort name",                 desc = "Sort alphabetically" },
	{ on = [",", "A"], run = "sort name --reverse",       desc = "Sort alphabetically (reverse)" },
	{ on = [",", "m"], run = "sort modified",             desc = "Sort by modified time" },
	{ on = [",", "M"], run = "sort modified --reverse",   desc = "Sort by modified time (reverse)" },
	{ on = [",", "s"], run = "sort size",                 desc = "Sort by size" },
	{ on = [",", "S"], run = "sort size --reverse",       desc = "Sort by size (reverse)" },
	{ on = [",", "e"], run = "sort extension",            desc = "Sort by extension" },
	{ on = [",", "E"], run = "sort extension --reverse",  desc = "Sort by extension (reverse)" },
	{ on = "<C-p>",   run = "preview toggle",              desc = "Toggle preview" },
	{ on = "<A-j>",   run = "preview seek 1",              desc = "Scroll preview down" },
	{ on = "<A-k>",   run = "preview seek -1",             desc = "Scroll preview up" },
]
